<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Space Invaders</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
    }
    #close-btn {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 1000;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.6);
      color: rgba(255,255,255,0.7);
      font-size: 20px;
      line-height: 34px;
      text-align: center;
      cursor: pointer;
      font-family: monospace;
      -webkit-tap-highlight-color: transparent;
    }
    #close-btn:hover, #close-btn:active {
      background: rgba(255,0,0,0.5);
      color: #fff;
      border-color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>
  <button id="close-btn" title="Close game">&times;</button>
  <script src="sketch.js"></script>
  <script>
    // Close button: exit fullscreen or close the window/tab
    document.getElementById('close-btn').addEventListener('click', function() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        window.close();
        // If window.close() is blocked (not opened by script), go back
        setTimeout(function() { history.back(); }, 200);
      }
    });

    // Auto-request fullscreen on first user interaction (mobile)
    function requestFS() {
      let el = document.documentElement;
      let rfs = el.requestFullscreen || el.webkitRequestFullscreen;
      if (rfs) {
        rfs.call(el).catch(function(){});
      }
      document.removeEventListener('touchstart', requestFS);
      document.removeEventListener('click', requestFS);
    }
    document.addEventListener('touchstart', requestFS, { once: true });
    document.addEventListener('click', requestFS, { once: true });
  </script>
</body>
</html>
